<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>태경 주식 AI급등주단타매매 PRO v8.0</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg0:#05080e;--bg1:#0a0f1a;--bg2:#0f1623;--bg3:#141d2f;--bg4:#1a2540;--bd:#1e2d48;--bd2:#2a3d5c;--t1:#e8ecf4;--t2:#8b99b4;--t3:#506080;--blue:#2d7ff9;--blue2:#5a9fff;--green:#00d68f;--red:#ff4757;--amber:#ffb347;--cyan:#00d4ff;--purple:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg0);color:var(--t1);font-family:'Noto Sans KR',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 0%,#2d7ff908,transparent 60%),radial-gradient(ellipse at 85% 100%,#00d68f06,transparent 60%);pointer-events:none}
.mono{font-family:'JetBrains Mono',monospace}
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(180deg,var(--bg1)ee,var(--bg0)ee);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:0 24px}
.hdr-top{display:flex;align-items:center;justify-content:center;height:58px;position:relative}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#2a0a0a,#4a0e0e,#1a0505);border:1.5px solid #ff354466;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 4px 24px #ff354433,inset 0 1px 1px #ffffff11;position:relative;overflow:hidden}
.logo-icon::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#ff354418,transparent);pointer-events:none}
.logo h1{font-size:20px;font-weight:800;letter-spacing:-.3px}.logo h1 span{color:#ff3544;font-weight:900}.logo small{font-size:10px;color:var(--t3);margin-left:8px;letter-spacing:1.5px;font-weight:700}
.hdr-right{display:flex;align-items:center;gap:14px;font-size:11px;position:absolute;right:0}
.hdr-left{display:flex;align-items:center;gap:8px;font-size:10px;position:absolute;left:0;color:var(--t3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red)}.dot.on{background:var(--green)}
.tabs{display:flex;gap:0;height:42px;overflow-x:auto;justify-content:center}
.tab{padding:0 20px;border:none;cursor:pointer;background:transparent;color:var(--t3);font-family:inherit;font-size:12px;font-weight:500;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent}
.tab.on{color:var(--t1);font-weight:700;border-bottom-color:var(--blue)}.tab:hover:not(.on){color:var(--t2);background:var(--bg2)}
.main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:20px 24px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
.card-h{font-size:14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-h small{font-size:10px;color:var(--t3);font-weight:400;margin-left:auto}
input,select{width:100%;padding:10px 14px;background:var(--bg1);border:1px solid var(--bd);border-radius:8px;color:var(--t1);font-family:inherit;font-size:13px;outline:none;transition:all .2s}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2d7ff918}
label{font-size:11px;color:var(--t3);margin-bottom:4px;display:block;font-weight:500}::placeholder{color:var(--t3)}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--blue);color:#fff}.btn-g{background:#00d68f22;color:var(--green);border:1px solid #00d68f44}
.btn-r{background:#ff475722;color:var(--red);border:1px solid #ff475744}.btn-gh{background:var(--bg3);color:var(--t2);border:1px solid var(--bd)}
.btn-sm{padding:6px 14px;font-size:11px;border-radius:6px}.btn:disabled{opacity:.4;cursor:not-allowed}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.stat{text-align:center;padding:16px 12px;border-radius:10px;background:var(--bg1);border:1px solid var(--bd)}
.stat-v{font-size:22px;font-weight:700;font-family:'JetBrains Mono'}.stat-l{font-size:10px;color:var(--t3);margin-top:4px;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{padding:10px 12px;text-align:left;color:var(--t3);font-weight:600;font-size:11px;border-bottom:2px solid var(--bd);background:var(--bg1)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd)}.tbl tr:hover td{background:var(--bg3)}
.plus{color:var(--green)}.minus{color:var(--red)}
.mode-card{padding:14px;border-radius:10px;border:2px solid var(--bd);cursor:pointer;transition:all .2s;position:relative}
.mode-card:hover{border-color:var(--bd2)}.mode-card.sel{border-color:var(--blue);background:var(--bg3)}
.mode-card.sel::after{content:'✓';position:absolute;top:8px;right:10px;color:var(--blue);font-weight:900}
.tag{display:inline-block;font-size:10px;padding:3px 10px;border-radius:5px;font-weight:600}
.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:14px 24px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;transform:translateX(120%);transition:transform .3s;max-width:400px}
.toast.show{transform:translateX(0)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.fi{animation:fadeIn .3s ease}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes gallop{0%,100%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-3px) scaleX(1.05)}50%{transform:translateY(0) scaleX(0.95)}75%{transform:translateY(-2px) scaleX(1.02)}}
@keyframes dust{0%{opacity:0.6;transform:translateX(0)}100%{opacity:0;transform:translateX(-15px)}}
@keyframes horseRun{0%,100%{transform:translateX(0) translateY(0)}15%{transform:translateX(2px) translateY(-6px)}30%{transform:translateX(4px) translateY(-2px)}50%{transform:translateX(2px) translateY(0)}65%{transform:translateX(0) translateY(-4px)}80%{transform:translateX(-2px) translateY(-1px)}}
@keyframes horseMane{0%,100%{transform:scaleX(1) skewX(0deg)}50%{transform:scaleX(1.15) skewX(-5deg)}}
@keyframes horseDust{0%{opacity:0.6;transform:translateX(0) scale(1)}100%{opacity:0;transform:translateX(-20px) scale(0.3)}}
@keyframes legFront1{0%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}100%{transform:rotate(-25deg)}}
@keyframes legFront2{0%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}100%{transform:rotate(20deg)}}
@keyframes legBack1{0%{transform:rotate(25deg)}50%{transform:rotate(-25deg)}100%{transform:rotate(25deg)}}
@keyframes legBack2{0%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}100%{transform:rotate(-20deg)}}
@keyframes aiBlink{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes hFL{0%{transform:rotate(-30deg)}100%{transform:rotate(25deg)}}
@keyframes hFL2{0%{transform:rotate(-25deg)}100%{transform:rotate(30deg)}}
@keyframes hBL{0%{transform:rotate(25deg)}100%{transform:rotate(-30deg)}}
@keyframes hBL2{0%{transform:rotate(30deg)}100%{transform:rotate(-25deg)}}
@keyframes maneFlow{0%{d:path("M68,18 Q60,10 55,14 Q48,8 42,12")}100%{d:path("M68,18 Q58,8 52,12 Q44,5 38,10")}}
@keyframes maneWave{0%{transform:translateX(0) scaleY(1)}50%{transform:translateX(-2px) scaleY(1.1)}100%{transform:translateX(0) scaleY(1)}}
@keyframes tailFlow{0%{transform:rotate(0deg) scaleX(1)}50%{transform:rotate(-8deg) scaleX(1.15)}100%{transform:rotate(0deg) scaleX(1)}}
@keyframes dustA{0%{opacity:0.6;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-18px,-6px) scale(2)}}
@keyframes dustB{0%{opacity:0.5;transform:translate(0,0) scale(0.8)}100%{opacity:0;transform:translate(-22px,-4px) scale(2.2)}}
@keyframes dustC{0%{opacity:0.4;transform:translate(0,0) scale(0.6)}100%{opacity:0;transform:translate(-14px,-8px) scale(1.8)}}
@keyframes speedLine{0%{opacity:0.5;transform:translateX(0) scaleX(1)}100%{opacity:0;transform:translateX(-20px) scaleX(0.3)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 4px var(--green,#00d68f)44)}50%{filter:drop-shadow(0 0 10px var(--green,#00d68f)88)}}
@keyframes dust3{0%{opacity:0.3;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(-12px,-8px) scale(1.3)}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg0)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
@media(max-width:768px){.g2,.g3,.g4{grid-template-columns:1fr}}
.hb{background:#1565c0;color:#fff;font-size:14px;font-weight:800;padding:6px 12px;border-radius:6px;margin-bottom:10px}
.ht{background:#00897b;color:#fff;font-size:14px;font-weight:800;padding:6px 12px;border-radius:6px;margin-bottom:10px}
.hp{background:#7b1fa2;color:#fff;font-size:14px;font-weight:800;padding:6px 12px;border-radius:6px;margin-bottom:10px}
.nd{border:2px solid var(--bd);border-radius:10px;padding:10px 14px;text-align:center;max-width:480px;margin:0 auto;background:var(--bg2)}
.ng{background:#1b5e2015;border-color:#4caf50}.nb{background:#0d47a115;border-color:#2196f3}
.nr{background:#b71c1c10;border-color:#f44336}.np{background:#4a148c10;border-color:#9c27b0}
.nk{background:#263238;color:#fff;border-color:#455a64}.ny{background:#e6510010;border-color:#ff9800}
.ngy{background:var(--bg1);border-color:#607d8b}
.ar{text-align:center;padding:2px;color:var(--t3);font-size:14px;font-weight:900}
.sp{flex:1;min-width:90px;border:1.5px solid var(--bd);border-radius:8px;padding:8px 6px;text-align:center;background:var(--bg2)}
.sp-t{font-size:12px;font-weight:800;margin-bottom:3px}.sp-d{font-size:10px;color:var(--t2);line-height:1.5}
.sp-v{font-size:10px;font-weight:700;margin-top:2px}
.bx{border:1.5px solid var(--bd);border-radius:8px;padding:10px 14px;background:var(--bg2)}
.lp{border:2.5px dashed var(--blue);border-radius:12px;padding:14px 12px;position:relative;margin:8px 0}
.ll{position:absolute;top:-11px;left:16px;background:var(--bg2);padding:0 10px;font-size:12px;font-weight:900;color:var(--blue)}
.ft{text-align:center;font-size:10px;color:var(--t3);margin-top:12px;padding-top:8px;border-top:1px solid var(--bd);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.box{border:1.5px solid var(--bd);border-radius:8px;padding:10px 14px;margin:6px 0;background:var(--bg2)}
.box-t{font-size:13px;font-weight:800;margin-bottom:4px}
.logo-p{text-align:center;padding:16px;background:linear-gradient(135deg,#1a0505,#2a0a0a);border-radius:12px;border:2px solid #c62828;margin-bottom:14px}
.step{border-left:4px solid var(--blue);padding:8px 14px;margin:6px 0;background:var(--bg1);border-radius:0 8px 8px 0}
</style>
</head>
<body>
<div class="hdr">
<div class="hdr-top">
<div class="hdr-left">
<span id="aiModel" style="color:var(--cyan);font-weight:600">-</span>
<span id="aiCost" class="mono" style="color:var(--amber)">₩0/월</span>
<span style="color:var(--bd)">│</span>
<span style="color:var(--t3);font-size:9px">🤖AI스캔</span>
<span style="font-size:9px;color:var(--t3)">전월</span><span id="hdrScanPrev" class="mono" style="color:var(--t2);font-size:11px;font-weight:600" title="전월 AI스캔">0</span>
<span style="color:var(--t3);font-size:9px">당월</span><span id="hdrScanCurr" class="mono" style="color:var(--purple);font-size:11px;font-weight:700" title="당월 AI스캔">0</span>
</div>
<div class="logo">
  <div class="logo-icon">
    <span style="font-size:16px;font-weight:900;color:#ff3544;line-height:1;letter-spacing:-1px;position:relative;z-index:1">T<span style="font-size:9px;color:#ffb3b3;font-weight:700">태</span>K<span style="font-size:9px;color:#ffb3b3;font-weight:700">경</span></span>
  </div>
  <h1><span>태경</span> 주식 AI급등주단타매매</h1><small>PRO SYSTEM V8.0</small>
</div>
<div class="hdr-right">
<span id="hdrDate" style="font-size:11px;font-weight:700;color:var(--t2)"></span>
<span id="clock" class="mono" style="color:var(--t1);font-size:12px;font-weight:700"></span>
<div style="display:flex;align-items:center;gap:5px"><div class="dot" id="sDot"></div><span id="sLbl" style="color:var(--t3);font-weight:600">서버</span></div>
<div style="display:flex;align-items:center;gap:5px"><div class="dot" id="kDot"></div><span id="kLbl" style="color:var(--t3);font-weight:600">증권사</span></div>

</div></div>
<div class="tabs" id="tabs"></div>
</div>
<div class="main" id="app"></div>
<script>
const LS=(k,d)=>{try{const v=localStorage.getItem(k);if(v===null)return d;const p=JSON.parse(v);return p!==null?p:d}catch{return d}};
const fmt=n=>(!n&&n!==0)?'-':Number(n).toLocaleString('ko-KR');
const fW=n=>{if(!n&&n!==0)return'-';return fmt(Math.round(n))};

const S={
  tab:'auto',apiKey:localStorage.getItem('sa_apikey')||'',
  dartKey:localStorage.getItem('sa_dartkey')||'',
  

  live:{appKey:localStorage.getItem('kl_ak')||'',appSecret:localStorage.getItem('kl_as')||'',account:localStorage.getItem('kl_ac')||'',connected:localStorage.getItem('sa_live_conn')==='1'},
  mode:'live',  // 실전 단일 모드
  autoRunning:false,maxHoldMin:parseInt(localStorage.getItem('sa_maxHoldMin')||'60'),autoAvgDown:localStorage.getItem('sa_autoAvgDown')!=='false',autoAvgPct:parseFloat(localStorage.getItem('sa_autoAvgPct')||'-2.5'),sectorUnique:localStorage.getItem('sa_sectorUnique')!=='false',avgR1:parseInt(localStorage.getItem('sa_avgR1')||'50'),avgR2:parseInt(localStorage.getItem('sa_avgR2')||'100'),avgR3:parseInt(localStorage.getItem('sa_avgR3')||'100'),surgeThreshold:parseInt(localStorage.getItem('sa_surgeThreshold')||'70'),cooldownMin:parseInt(localStorage.getItem('sa_cooldownMin')||'10'),tpMode:(localStorage.getItem('sa_tpMode')||'full').replace(/"/g,''),tp1Ratio:parseInt(localStorage.getItem('sa_tp1Ratio')||'40'),tp2Ratio:parseInt(localStorage.getItem('sa_tp2Ratio')||'30'),tp3Ratio:parseInt(localStorage.getItem('sa_tp3Ratio')||'30'),avgPct1:parseFloat(localStorage.getItem('sa_avgPct1')||localStorage.getItem('sa_autoAvgPct')||'-2.5'),avgPct2:parseFloat(localStorage.getItem('sa_avgPct2')||'0'),avgPct3:parseFloat(localStorage.getItem('sa_avgPct3')||'0'),rules:LS('sa_rules',[]),preset:localStorage.getItem('sa_preset')||'F',
  _sec_avgDown:true,
  _livePositions:[],_liveTotalEval:0,_liveCash:0,_liveTotalPnl:0,_livePosTime:'',
  _anaData:null,_sec_analytics:false,
  _orderbook:null,_obTicker:'',_obLoading:'',
  maxPos:parseInt(localStorage.getItem('sa_maxpos')||'6'),
  cashRatio:parseInt(localStorage.getItem('sa_cashratio')||'60'),
  sectorRatio:parseInt(localStorage.getItem('sa_sectorratio')||'40'),
  cashLimit:parseInt(localStorage.getItem('sa_cashlimit')||'0'),
  autoLevel:localStorage.getItem('sa_autolevel')||'full', // full, preset, custom
  dailyTarget:parseInt(localStorage.getItem('sa_dailytarget')||'10'),
  dailyTargetAmt:parseInt(localStorage.getItem('sa_dailyTargetAmt')||'0'),
  dailyTargetLiquidate:localStorage.getItem('sa_dailyTargetLiquidate')==='true',
  _sessions:JSON.parse(localStorage.getItem('sa_sessions_'+new Date().toISOString().slice(0,10))||'[]'),
  targetLiqBuf:parseInt(localStorage.getItem('sa_targetLiqBuf')||'10'),
  lossLiqBuf:parseInt(localStorage.getItem('sa_lossLiqBuf')||'10'),
  dailyLossAmt:parseInt(localStorage.getItem('sa_dailyLossAmt')||'0'),
  dailyLossLiquidate:localStorage.getItem('sa_dailyLossLiquidate')==='true',
  maxPerStock:parseInt(localStorage.getItem('sa_maxperstock')||'30'),
  dailyLoss:(localStorage.getItem('sa_dailyloss')===null?0:parseInt(localStorage.getItem('sa_dailyloss'))),
  maxBuyAmt:parseInt(localStorage.getItem('sa_maxbuyamt')||'300000'),
  safetyProfile:localStorage.getItem('sa_safety')||'normal',
  // 스캔 간격 (6구간, 분 단위) - 기본값
  scanIntervals: (()=>{
    const DEF = {
      s2:{label:'장초반',  range:'9:00~10:00',min:2},
      s3:{label:'장중반',  range:'10:00~11:00',min:2},
      s3b:{label:'오전',   range:'11:00~12:00',min:3},
    };
    // ★ 전역 접근용 기본값 (기본값 복원 + 유저값 감지)
    window.SCAN_DEF = DEF;
    try {
      const raw = localStorage.getItem('sa_scaniv');
      if (!raw) return JSON.parse(JSON.stringify(DEF));
      const saved = JSON.parse(raw);
      if (!saved || typeof saved !== 'object') return JSON.parse(JSON.stringify(DEF));
      const out = {};
      Object.keys(DEF).forEach(k => {
        const d = DEF[k], s = saved[k];
        let m = d.min;
        if (s != null) {
          m = typeof s === 'object' ? parseInt(s.min || d.min) : parseInt(s || d.min);
          if (isNaN(m)) m = d.min;
        }
        out[k] = {...d, min: m};
      });
      return out;
    } catch(e) { return JSON.parse(JSON.stringify(DEF)); }
  })(),

  aiProvider:localStorage.getItem('sa_aiprovider')||'openai',
  openaiKey:localStorage.getItem('sa_openaikey')||'',
  aiPickCount:10,
  aiStrategy:'실적개선 우량주',
  pos:[],bal:{},log:[],phase:'',briefing:null,modal:null,timer:null,
  autoTickers:LS('sa_autotickers',[]),
  aiPreset:localStorage.getItem('sa_aipreset')||'normal',
  // ★ AI 매도 병행 기준: 규칙은 비상 브레이크 (여유있게)
  aiTp1:parseFloat(localStorage.getItem('sa_aiTp1')||'2.5'),
  aiTp2:parseFloat(localStorage.getItem('sa_aiTp2')||'4.5'),
  aiTp3:parseFloat(localStorage.getItem('sa_aiTp3')||'7'),
  aiSl:(localStorage.getItem('sa_aiSl')===null?-4:parseFloat(localStorage.getItem('sa_aiSl'))),
  aiMinConf:parseInt(localStorage.getItem('sa_aiMinConf')||'70'),
  excludeEtf:localStorage.getItem('sa_excludeEtf')!=='false', // 기본 true = ETF 제외
  // 텔레그램
  tgToken:localStorage.getItem('sa_tgToken')||'',
  tgChatId:localStorage.getItem('sa_tgChatId')||'',
  tgEnabled:localStorage.getItem('sa_tgEnabled')==='true',
  tg_on_buy:localStorage.getItem('sa_tg_on_buy')!=='false',
  tg_on_sell:localStorage.getItem('sa_tg_on_sell')!=='false',
  tg_on_briefing:localStorage.getItem('sa_tg_on_briefing')!=='false',
  tg_on_error:localStorage.getItem('sa_tg_on_error')!=='false',
  _userName:localStorage.getItem('sa_userName')||'',
  // ★ 장마감 강제청산
  forceClose:localStorage.getItem('sa_forceClose')==='true',
  forceCloseTime:parseInt(localStorage.getItem('sa_forceCloseTime')||'1515'),
  // ★ 재시작 세션 baseline (재시작 시 자동 설정)
  _sessionBaseline:0,
};

const TABS=[{id:'sys',ic:'📋',lb:'시스템구조'},{id:'cfg',ic:'⚙️',lb:'단타설정'},{id:'auto',ic:'🤖',lb:(()=>{const m=S&&S.mode;return '🤖 AI자동매매'})()},{id:'results',ic:'📈',lb:'결과'}];

// 검색용 (부분 일치)
function toast(m,t='info'){const c={success:'#00d68fee',error:'#ff4757ee',info:'#2d7ff9ee',warn:'#ffb347ee'};const e=document.createElement('div');e.className='toast';e.style.background=c[t]||c.info;e.textContent=m;document.body.appendChild(e);requestAnimationFrame(()=>e.classList.add('show'));setTimeout(()=>{e.classList.remove('show');setTimeout(()=>e.remove(),300)},3000)}

// === Universal AI Call ===
async function callAI(prompt,opts={}){
  const provider=S.aiProvider||'openai';
  const activeKey=getActiveKey();
  if(!activeKey){throw new Error('AI API키를 세팅에서 입력하세요')}
  const r=await api('chat/msg',{
    provider, apiKey:activeKey,
    system:opts.system||'한국 주식시장 전문 분석가. 한글 위주 응답. JSON 요청 시 JSON만 반환.',
    messages:[{role:'user',content:prompt}],
    max_tokens:opts.max_tokens||2048,
    web_search:opts.webSearch===true
  });
  if(r.error&&!r.reply){throw new Error(r.error)}
  return {_reply:r.reply||''};
}

function getAIText(data){
  // OpenAI Responses API format
  if(data.output){
    return data.output.filter(i=>i.type==='message').map(i=>(i.content||[]).filter(c=>c.type==='output_text').map(c=>c.text).join('')).join('');
  }
  // OpenAI Chat Completions format (legacy)
  if(data.choices) return (data.choices[0]?.message?.content||'');
  // Claude format
  if(data.content) return data.content.filter(c=>c.type==='text').map(c=>c.text).join('');
  return '';
}

// Data source indicator tags
function srcTags(sources){
  const icons={
    'naver':'🇰🇷 국내시세','news':'📰 뉴스','dart':'📋 DART','global':'🇺🇸 해외증시',
    'fx':'💱 환율/유가','briefing':'📊 시황','trade':'📈 매매결과','history':'📅 30일',
    'kis':'🏦 KIS증권','ai':'⚡ mini스캔+4o분석','websearch':'🔍 웹검색'
  };
  return `<div style="display:flex;gap:4px;flex-wrap:wrap;margin:6px 0">`+
    sources.map(s=>{
      const [key,active]=Array.isArray(s)?s:[s,true];
      const label=icons[key]||key;
      return active
        ?`<span style="font-size:9px;padding:2px 6px;border-radius:10px;background:var(--green)15;color:var(--green);border:1px solid var(--green)33">${label}</span>`
        :`<span style="font-size:9px;padding:2px 6px;border-radius:10px;background:var(--bg3);color:var(--t3);border:1px solid var(--bd);text-decoration:line-through">${label}</span>`;
    }).join('')+`</div>`;
}

function updApiDisplay(u){
  const calls=u.calls||0, ws=u.web_searches||0;
  const lastModel=u.last_model||u.model||'';
  const models=u.models||{};

  // 단가표 (per 1M tokens, USD)
  const PRICE={
    'gpt-4o-mini':{in:0.15, out:0.6,  ws:0.025},
    'gpt-4o':     {in:2.5,  out:10.0, ws:0.03},
    'claude-sonnet':{in:3.0, out:15.0, ws:0},
    'claude-opus': {in:15.0, out:75.0, ws:0},
  };

  let totalUsd=0;
  let breakdown=[];

  if(Object.keys(models).length>0){
    for(const [mk, mv] of Object.entries(models)){
      const p=PRICE[mk]||{in:3.0,out:15.0,ws:0};
      const inT=mv.input_tokens||0, outT=mv.output_tokens||0;
      const wsN=mv.web_searches||0, cN=mv.calls||0;
      const tokUsd=((inT*p.in)+(outT*p.out))/1000000;
      const wsUsd=wsN*p.ws;
      const subTotal=tokUsd+wsUsd;
      totalUsd+=subTotal;
      if(cN>0) breakdown.push(
        mk+': '+cN+'회 In:'+(inT/1000).toFixed(0)+'K Out:'+(outT/1000).toFixed(0)+'K'+
        (wsN?' 🔍'+wsN+'회':'')+' = $'+subTotal.toFixed(4)
      );
    }
  } else {
    const inTok=u.input_tokens||0, outTok=u.output_tokens||0;
    const p=PRICE[lastModel]||{in:0.15,out:0.6,ws:0.025};
    totalUsd=((inTok*p.in)+(outTok*p.out))/1000000 + ws*p.ws;
    breakdown.push((lastModel||'?')+': In:'+(inTok/1000).toFixed(0)+'K Out:'+(outTok/1000).toFixed(0)+'K');
  }

  const costKrw=Math.round(totalUsd*1380);
  const el1=document.getElementById('aiModel');
  const el2=document.getElementById('aiCost');

  const shortModel=
    lastModel.includes('gpt-4o-mini')?'GPT-4o-mini':
    lastModel.includes('gpt-4o')?'GPT-4o':
    lastModel.includes('claude-opus')?'Claude Opus':
    lastModel.includes('claude')?'Claude Sonnet':
    getProviderLabel();
  if(el1)el1.textContent=shortModel;

  if(el2){
    el2.textContent='₩'+fmt(costKrw)+'/월';
    el2.title='[월 누적 AI 비용] '+(u.month||'')+'\n총 호출: '+calls+'회 | 웹검색: '+ws+'회\n합계: $'+totalUsd.toFixed(4)+' = ₩'+fmt(costKrw)+'\n\n[모델별 내역]\n'+breakdown.join('\n');
  }
}

async function kisRefresh(){const k=gk();if(!k.appKey||!k.appSecret)return;
  try{const r=await kapi('balance');
    if(r.rt_cd&&r.rt_cd!=='0'){console.log('Balance error:',r.rt_cd,r.msg1);toast('잔고조회 실패: '+r.msg1,'warn');return}
    if(r.error){console.log('Balance error:',r.error);toast('잔고조회 오류: '+r.error,'warn');return}
    if(r.output1){
      const newPos=r.output1.filter(p=>parseInt(p.hldg_qty||'0')>0);
      // ★★★ v8.0: 최근 매도 종목 필터 (KIS 체결 지연 대응 — 10초간 숨김) ★★★
      const _now=Date.now();
      const _recentSold=S._recentSoldTickers||{};
      const _filtered=newPos.filter(p=>{
        const _soldTs=_recentSold[p.pdno];
        if(_soldTs && (_now-_soldTs)<10000) return false; // 10초간 숨김
        return true;
      });
      // 만료된 매도 기록 정리
      for(const k in _recentSold){if((_now-_recentSold[k])>10000)delete _recentSold[k]}
      // WS 보존: KIS에 없지만 autoTickers에 있는 종목 (매수 직후 대응)
      const _newTks = new Set(_filtered.map(p=>p.pdno));
      const _allTracked = new Set(S.autoTickers||[]);
      const _wsAdded = S.pos.filter(p => !_newTks.has(p.pdno) && parseInt(p.hldg_qty||0) > 0 && _allTracked.has(p.pdno) && !_recentSold[p.pdno]);
      S.pos = [..._filtered, ..._wsAdded];
    }
    if(r.output2&&r.output2[0]){
      S.bal=r.output2[0];k.connected=true;
      S.balUpdAt=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      // 계좌명 저장 (있으면)
      if(r.output2[0].pchs_amt_smtl_amt!==undefined&&!S._userName){
        S._userName=localStorage.getItem('sa_userName')||'';
      }
      console.log('[BAL] tot='+r.output2[0].tot_evlu_amt+' 예수금='+r.output2[0].dnca_tot_amt+' 주문가능='+r.output2[0].ord_psbl_cash);
    }
    // ★ v3.0: 증시+고저가 데이터 (REST 응답에서 바로 저장)
    if(r._market && r._market.kospi){
      S._mktKospi = r._market.kospi;
      S._mktKospiChg = r._market.kospi_chg || '';
      S._mktKosdaq = r._market.kosdaq || '';
      S._mktKosdaqChg = r._market.kosdaq_chg || '';
    }
    if(r._priceDetail){
      if(!S._priceDetail) S._priceDetail={};
      for(const[k,v] of Object.entries(r._priceDetail)){
        S._priceDetail[k] = {...(S._priceDetail[k]||{}), ...v};
      }
    }
    if(r._market_history && r._market_history.length) S._mktHistory = r._market_history;
  }catch(e){console.log('Balance fetch error:',e);}
  // ★★★ v8.0: 가격 변경 시에만 R() — 불필요한 DOM 리렌더 방지 ★★★
  const _posHash=(S.pos||[]).map(p=>(p.pdno||'')+(p.prpr||'')+(p.hldg_qty||'')).join();
  if(_posHash!==S._lastPosHash){S._lastPosHash=_posHash;R()}
}

function getSettingBadge(){
  const presetNames={safe:'🛡️안전',normal:'⚖️보통',aggro:'⚡공격'};
  const slLabel=(S.aiSl||0)===0?'손절없음':`손절${S.aiSl}%`;
  const tp1=S.aiTp1||2.5, tp2=S.aiTp2||4.5, tp3=S.aiTp3||7;

  // 수익목표 - 금액 우선, 없으면 %, 둘 다 없으면 없음
  const targetLabel=(()=>{
    if(S.dailyTargetAmt>0){
      const liq=S.dailyTargetLiquidate?(` 강제청산${S.targetLiqBuf>0?`+${S.targetLiqBuf}%버퍼`:''}`):'';
      return ` · 목표₩${(S.dailyTargetAmt/10000).toFixed(0)}만${liq}`;

      const liq=S.dailyTargetLiquidate?` 강제청산`:'';
      return ` · 목표+${S.dailyTarget}%${liq}`;
    }
    return ' · 목표없음';
  })();
  // 손실한도 - 금액 우선, 없으면 %, 둘 다 없으면 없음
  const lossLabel=(()=>{
    if(S.dailyLossAmt>0){
      const liq=S.dailyLossLiquidate?(` 강제청산${S.lossLiqBuf>0?`+${S.lossLiqBuf}%버퍼`:''}`):'';
      return ` · 손실₩${(S.dailyLossAmt/10000).toFixed(0)}만${liq}`;
    }
    if(S.dailyLoss>0){
      const liq=S.dailyLossLiquidate?` 강제청산`:'';
      return ` · 손실한도-${S.dailyLoss}%${liq}`;
    }
    return ' · 손실한도없음';
  })();
  const fcLabel=S.forceClose?` · 장마감${S.forceCloseTime?Math.floor(S.forceCloseTime/100)+':'+String(S.forceCloseTime%100).padStart(2,'0'):'15:15'}청산`:'';
  const sessLabel=(S._sessions||[]).length>0?` · ${(S._sessions||[]).length+1}차세션`:'';
  const tpModeLabel=(S.tpMode||'full')==='full'?'전량매도':'분할';
  const _avgRounds=(parseFloat(S.avgPct3||0)<0?3:parseFloat(S.avgPct2||0)<0?2:1);
  const avgLabel=S.autoAvgDown?`물타기${_avgRounds}차(${S.avgPct1||-4}%)`:'물타기OFF';

}

      try{const r=await api('auto/rules',{action:'add',rule});if(r.success)S.rules=r.rules}catch(e){}
    }
    const r=await api('auto/start',{
      app_key:k.appKey,app_secret:k.appSecret,mode:S.mode,account:k.account,account_cd:'01',

async function autoRestart(){
  try{ await api('auto/clear_block'); }catch(e){}
  // 현재 손익을 baseline으로 기록해 세션 구분
  const today=new Date().toISOString().slice(0,10);
  const key='sa_sessions_'+today;
  const sessions=JSON.parse(localStorage.getItem(key)||'[]');
  // 현재 todaySellPnl 계산 (log에서)
  const curPnl=S._todayPnl||0;
  const sessionNum=sessions.length+1;
  const label=sessions.length===0?'최초':sessions.length+'차';
  sessions.push({label,pnl:Math.round(curPnl),time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})});
  localStorage.setItem(key, JSON.stringify(sessions));
  S._sessions=sessions;
  // ★ 세션 baseline 저장 → 서버에 전달해서 목표 리셋

  await autoStart();
}

async function searchManualBuy(){
  const input=document.getElementById('manualBuyInput');
  const box=document.getElementById('manualBuyResult');
  if(!input||!box)return;
  const q=input.value.trim();
  if(!q){box.innerHTML='';return}
  const k=gk();if(!k.connected){toast('증권사 연결 먼저','warn');return}
  box.innerHTML='<div style="font-size:11px;color:var(--t3)">🔍 검색 중...</div>';
  
  let ticker='',stockName='';
  // 6자리 코드면 바로 사용
  if(/^\d{6}$/.test(q)){
    ticker=q;
  } else {
    // 네이버 검색 (메인서버 API)
    try{
      const sr=await api('naver/search',{query:q});
      if(sr.results?.length){
        ticker=sr.results[0].ticker;
        stockName=sr.results[0].name;
      }
    }catch(e){}
  }
  if(!ticker){box.innerHTML='<div style="font-size:11px;color:var(--red)">❌ 종목을 찾을 수 없습니다</div>';return}
  
  // KIS 시세 조회
  try{
    const pr=await kapi('price',{ticker:ticker});
    const o=pr.output||{};
    const nm=o.hts_kor_isnm||stockName||ticker;
    const cur=parseInt(o.stck_prpr||0);
    const chg=o.prdy_ctrt||'0';
    const oprc=parseInt(o.stck_oprc||0);
    const hgpr=parseInt(o.stck_hgpr||0);
    const lwpr=parseInt(o.stck_lwpr||0);
    const vol=parseInt(o.acml_vol||0);
    
    if(cur<=0){box.innerHTML='<div style="font-size:11px;color:var(--red)">❌ 시세 조회 실패</div>';return}
    if(oprc===0&&vol===0){box.innerHTML='<div style="font-size:11px;color:var(--red)">⛔ 거래정지 종목 — 매매 불가</div>';return}
    
    const chgC=parseFloat(chg)>=0?'var(--green)':'var(--red)';
    box.innerHTML=`
      <div style="background:var(--bg1);border-radius:8px;padding:12px;border:1px solid var(--bd)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">

          <span class="mono" style="font-size:10px;color:var(--t3)">${ticker}</span>
          <span class="mono" style="font-size:14px;font-weight:900;color:var(--t1)">₩${cur.toLocaleString()}</span>
          <span class="mono" style="font-size:12px;font-weight:700;color:${chgC}">${parseFloat(chg)>=0?'+':''}${chg}%</span>
        </div>
        <div style="font-size:10px;color:var(--t3);margin-bottom:10px">
          시가 ₩${oprc.toLocaleString()} | 고가 ₩${hgpr.toLocaleString()} | 저가 ₩${lwpr.toLocaleString()} | 거래량 ${vol.toLocaleString()}
        </div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
          <div>
            <div style="font-size:9px;color:var(--t3);margin-bottom:2px">매수단가 (0=시장가)</div>
            <input id="mbPrice" type="number" value="${cur}" style="width:110px;padding:5px 8px;background:var(--bg0);border:1px solid var(--bd);border-radius:6px;color:var(--t1);font-size:12px;text-align:right" oninput="calcManualBuyAmt()">

  if(el) el.textContent=p>0&&q>0?`₩${(p*q).toLocaleString()}`:'시장가';

async function execManualBuy(ticker,name,curPrice){
  const k=gk();if(!k.connected){toast('증권사 연결 먼저','warn');return}
  const bp=parseInt(document.getElementById('mbPrice')?.value||0);
  const bq=parseInt(document.getElementById('mbQty')?.value||0);
  if(bq<=0){toast('수량을 입력하세요','warn');return}
  const orderType=bp>0?`지정가 ₩${bp.toLocaleString()}`:'시장가';
  if(!confirm(`📥 ${name}(${ticker}) ${orderType} 매수\n수량: ${bq}주\n${bp>0?'매수금액: ₩'+(bq*bp).toLocaleString():'시장가 즉시 체결'}\n\n진행하시겠습니까?`)) return;
  toast(`📥 ${name} ${bq}주 ${orderType} 매수 주문 중...`,'info');
  try{
    const r=await kapi('order',{order_type:'buy',ticker:ticker,qty:String(bq),price:String(bp),ord_dvsn:bp>0?'00':'01'});
    const ok=r.rt_cd==='0';
    if(ok && r._filled){
      toast(`✅ ${name} ${bq}주 체결 완료! (보유 ${r._new_qty}주)`,'success');

async function manualSell(ticker,name,holdQty,curPrice){

  // ── v4.0: 기술적 지표 분석 패널 (보유종목 📊 클릭 시 표시) ──

  // ── 3a-2. 물타기 내역 (접이식) ── 당일 물타기 전 종목 (보유+매도 포함) ──
  // ★ v6.0: 서버에서 직접 전송하는 avg_detail 사용 (S.log 의존 제거)
  const _avgDetail=S.avgDetail||{};
  const _allLg=S.log||[];
  const _avgMap={};

  Object.entries(_avgDetail).forEach(([tk,d])=>{
    _avgMap[tk]={ticker:tk, name:d.name||tk, entries:d.entries||[], totalQty:(d.entries||[]).reduce((s,e)=>s+(e.qty||0),0), totalAmt:(d.entries||[]).reduce((s,e)=>s+(e.qty||0)*(e.price||0),0)};
  });
  // 2순위: S.log 보완
  _allLg.filter(l=>l.type==='AVG_DOWN'&&l.success&&(l.date||'').slice(0,10)===today).forEach(l=>{
    const tk=l.ticker||'';

  // 매수 로그에서 최초 매수 정보
  const _buyInfo={};
  _allLg.filter(l=>['AI_BUY','BUY'].includes(l.type)&&l.success&&(l.date||'').slice(0,10)===today).forEach(l=>{
    const tk=l.ticker||'';
    if(!_buyInfo[tk]) _buyInfo[tk]={qty:parseInt(l.qty||0),price:parseFloat(l.price||0),time:(l.time||'').slice(11,16)};
  });
  // 매도 로그에서 결과 (물타기 종목의 최종 결과)
  const _sellInfo={};
  _allLg.filter(l=>['SELL','FORCE_CLOSE'].includes(l.type)&&l.success&&(l.date||'').slice(0,10)===today).forEach(l=>{
    const tk=l.ticker||'';
    if(!_sellInfo[tk]) _sellInfo[tk]={totalQty:0,totalAmt:0,totalPnl:0,reasons:[]};
    const s=_sellInfo[tk]; const qty=parseInt(l.qty||0),price=parseFloat(l.price||0),pnl=parseFloat(l.pnl||0);

  });
  // 물타기 종목 리스트 (보유 중 + 매도 완료)
  const _avgTks=Object.keys(_avgMap);
  const _avgAllCount=Object.values(_avgMap).reduce((s,d)=>s+d.entries.length,0);

  const _posMap={};
  autoPos.forEach(p=>{_posMap[p.pdno||p.ticker]={cur:parseFloat(p.prpr||0),avg:parseFloat(p.pchs_avg_pric||0),qty:parseInt(p.hldg_qty||0)};});
  const _avgOpen=S._sec_avgDown||false;
  // 물타기 종합 통계

  if(_avgOpen){

          avgData.entries.forEach(e=>{
            h+=`<tr style="border-bottom:1px solid var(--bd)"><td style="padding:3px 6px"><span style="padding:1px 5px;border-radius:3px;background:#ff980018;color:#ff9800;font-weight:700;font-size:9px">${e.round}차</span></td><td class="mono" style="padding:3px 6px">${e.fullTime}</td><td class="mono r" style="padding:3px 6px">${e.qty}주</td><td class="mono r" style="padding:3px 6px">₩${nf(e.price)}</td><td class="mono r" style="padding:3px 6px">₩${nf(e.qty*e.price)}</td><td style="padding:3px 6px;color:var(--t3);font-size:9px">${e.message.slice(0,45)}</td></tr>`;

  // ── 3b. 매도 실적 요약 (접이식) ──────────────────────────────────
  const _isSell=l=>['SELL','FORCE_CLOSE','CHAT_SELL','AI_SELL'].includes(l.type)&&(l.success===true||l.success===1||l.success==='true');
  const todaySellsDone=todayLog.filter(_isSell);
  const allSellsDone=(allLog||[]).filter(_isSell);
  const sellOpen=S._sec_sellSummary||false;

  // ★ v6.0: 매수 기준 라운드 분리 (분할매도는 같은 라운드로 합산)
  const groupSells=(sells)=>{

      if(['AI_BUY','BUY','CHAT_BUY'].includes(l.type)&&l.success&&l.ticker){
        const _bd=(l.date||l.time||'').slice(0,10);
        if(!buyTimes[l.ticker]) buyTimes[l.ticker]={};
        if(!buyTimes[l.ticker][_bd]) buyTimes[l.ticker][_bd]=[];

    const sorted=[...sells].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    sorted.forEach(l=>{

      let rd=1;
      for(let i=0;i<buys.length;i++){
        if(buys[i]<=sellTime) rd=i+1;
        else break;
      }
      const key=dt+'_'+tk+'_R'+rd;
      if(!map[key]){
        map[key]={...l, qty:0, pnl:0, sell_amt:0, trade_cost:0, reasons:[], _round:rd, _totalBuys:buys.length};
      }
      const g=map[key];
      const qty=parseInt(l.qty||0);
      const price=parseFloat(l.price||0);
      const avgP=parseFloat(l.avg_price||0);
      const pnl=l.pnl!=null?parseFloat(l.pnl):(avgP>0?(price-avgP)*qty:0);
      const pct=l.pnl_pct!=null?parseFloat(l.pnl_pct):(avgP>0?(price-avgP)/avgP*100:0);
      g.qty+=qty; g.pnl+=pnl; g.sell_amt+=price*qty;
      g.trade_cost+=parseFloat(l.trade_cost||0);
      if(!g.avg_price&&avgP>0) g.avg_price=avgP;
      if((l.time||'')>(g.time||'')) g.time=l.time;
      const reasonText=(l.reason||l.message||'').replace(/\[설정값.*?\]/g,'').trim();
      g.reasons.push(`${qty}주 ${pct>=0?'+':''}${pct.toFixed(1)}% ${reasonText.slice(0,30)}`);
    });
    return Object.values(map);
  };
  const todayGrouped=groupSells(todaySellsDone);
  const allGrouped=groupSells(allSellsDone);

  // 실현손익 계산 (묶인 기준)
  const calcPnl=(grouped)=>{
    let totalPnl=0,wins=0,losses=0,totalAmt=0,totalCost=0;

      totalPnl+=g.pnl; totalAmt+=g.sell_amt; totalCost+=(g.trade_cost||0);
      if(g.pnl>0) wins++; else if(g.pnl<0) losses++;
    });
    const winRate=grouped.length>0?Math.round(wins/grouped.length*100):0;
    return {totalPnl,wins,losses,draws:grouped.length-wins-losses,winRate,totalAmt,totalCost};

  const todayStats=calcPnl(todayGrouped);

    :'오늘 매도 없음';

  // ── 세션별 손익 계산 ──

    </div>`;
  if(sellOpen){
    // 오늘 요약 카드
    h+=`<div style="padding:0 18px 18px 18px;border-top:1px solid var(--bd)">
      <div style="height:12px"></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">
        <div style="background:var(--bg1);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--bd)">
          <div style="font-size:10px;color:var(--t3);margin-bottom:3px">오늘 실현손익 <span style="font-size:8px">(비용차감)</span></div>
          <div style="font-size:16px;font-weight:700;color:${todayStats.totalPnl>=0?'var(--green)':'var(--red)'}">${todayStats.totalPnl>=0?'+':''}₩${fmt(Math.round(todayStats.totalPnl))}</div>

          <div style="font-size:10px;color:var(--t3);margin-bottom:3px">오늘 승률</div>

          <div style="font-size:16px;font-weight:700;color:${allStats.totalPnl>=0?'var(--green)':'var(--red)'}">${allStats.totalPnl>=0?'+':''}₩${fmt(Math.round(allStats.totalPnl))}</div>
          ${allStats.totalCost?`<div style="font-size:8px;color:var(--t3)">비용 -₩${fmt(Math.round(allStats.totalCost))}</div>`:''}
        </div>
        <div style="background:var(--bg1);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--bd)">
          <div style="font-size:10px;color:var(--t3);margin-bottom:3px">전체 승률</div>
          <div style="font-size:16px;font-weight:700;color:var(--t1)">${allStats.winRate}%</div>
          <div style="font-size:9px;color:var(--t3)">총 ${allGrouped.length}건 · 익${allStats.wins}/손${allStats.losses}</div>

      </div>`;

    // 매도 내역 테이블 (종목별 묶음)
    let recentSells=allGrouped.slice().sort((a,b)=>(b.time||'').localeCompare(a.time||'')).slice(0,50);
    // ★ v3.0: 매도내역 수익률 정렬
    if(S._sellSortBy==='pnl'){
      recentSells.sort((a,b)=>{
        const pa=a.pnl||0, pb=b.pnl||0;
        return S._sellSortDir==='asc'?pa-pb:pb-pa;
      });
    }
    const _sellArrow=S._sellSortBy==='pnl'?(S._sellSortDir==='asc'?'▲':'▼'):'⇅';
    if(recentSells.length){
      h+=`<div style="overflow-x:auto;overflow-y:auto;max-height:560px;border:1px solid var(--bd);border-radius:10px">
        <table class="tbl"><thead><tr>
          <th style="position:sticky;top:0;background:var(--bg1);z-index:1">시간</th><th style="position:sticky;top:0;background:var(--bg1);z-index:1">종목</th><th class="r" style="position:sticky;top:0;background:var(--bg1);z-index:1">매도가</th><th class="r">수량</th><th class="r">매도금액</th><th class="r">평단가</th><th class="r">손익</th><th class="r" style="cursor:pointer;user-select:none" onclick="S._sellSortBy=S._sellSortBy==='pnl'?'':'pnl';S._sellSortDir=S._sellSortDir==='desc'?'asc':'desc';R()">수익률 ${_sellArrow}</th><th>사유</th>
        </tr></thead><tbody>`;
      recentSells.forEach(g=>{
        const pnl=g.pnl||0;
        const avgP=parseFloat(g.avg_price||0);
        const sellPrice=g.qty>0?Math.round(g.sell_amt/g.qty):parseFloat(g.price||0);
        // ★ FIX: 수익률 = 총손익 / 총매입금액 (그룹 전체 기준, 첫 건만 쓰면 안됨)
        const pnlPct=avgP>0&&g.qty>0?(pnl/(avgP*g.qty)*100):0;
        const sellAmt=Math.round(g.sell_amt||0);
        const hasPnl=avgP>0;
        const isWin=pnl>0, isLoss=pnl<0;
        const pnlColor=isWin?'var(--green)':isLoss?'var(--red)':'var(--t3)';
        const rowBg=isWin?'rgba(0,214,143,0.03)':isLoss?'rgba(255,71,87,0.03)':'';
        const t=(g.time||'').slice(5,16).replace('T',' ');
        h+=`<tr style="background:${rowBg}">
          <td class="mono" style="font-size:10px;color:var(--t3);white-space:nowrap">${t}</td>
          <td><div style="font-weight:600;font-size:11px">${sn(g.name,g.ticker)}${mktTag(g.ticker)}${(g._totalBuys||0)>1?` <span style="font-size:8px;padding:1px 4px;border-radius:3px;background:#ff980022;color:#ff9800;border:1px solid #ff980033">${g._round}차</span>`:''}</div><div class="mono" style="font-size:9px;color:var(--t3)">${g.ticker||''}</div></td>
          <td class="r mono" style="font-size:12px;font-weight:700">₩${fmt(Math.round(sellPrice))}</td>
          <td class="r mono" style="color:var(--t2)">${fmt(g.qty)}주</td>
          <td class="r mono" style="color:var(--t2)">₩${fmt(sellAmt)}</td>
          <td class="r mono" style="color:var(--t3);font-size:10px">${hasPnl?'₩'+fmt(Math.round(avgP)):'-'}</td>
          <td class="r mono" style="font-weight:700;color:${pnlColor}">${hasPnl?(pnl>=0?'+':'')+'₩'+fmt(Math.round(pnl)):'-'}${g.trade_cost?`<div style="font-size:8px;color:var(--t3)">비용-₩${fmt(Math.round(g.trade_cost))}</div>`:''}</td>
          <td class="r"><span style="padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700;background:${isWin?'#00d68f20':isLoss?'#ff475720':'#ffffff10'};color:${pnlColor}">${hasPnl?(pnlPct>=0?'+':'')+pnlPct.toFixed(2)+'%':'-'}</span></td>
          <td style="font-size:10px;color:var(--t3);max-width:220px;white-space:normal;line-height:1.5">${(g.reasons||[]).map(r=>'<div>'+r+'</div>').join('')}</td>
        </tr>`;
      });
      h+=`</tbody></table></div>`;
    } else {
      h+=`<div style="text-align:center;padding:20px;color:var(--t3);font-size:12px">매도 내역이 없습니다. 익절/손절이 실행되면 여기에 표시됩니다.</div>`;
    }
    h+=`</div>`; // padding wrapper
  }
  h+=`</div>`; // outer card

  // ── 4. 거래내역 ─────────────────────────────────────────────────
  const AUTO_LOG_MAJOR=['AI_BUY','BUY','CHAT_BUY','SWING_BUY','TG_BUY','SELL','CHAT_SELL','AI_SELL','FORCE_CLOSE','BLOCKED','CAPITAL_BLOCK','ERROR','SELL_ERROR','AI_VERIFY_FAIL','AI_VERIFY_PASS','AI_ERROR','AVG_DOWN','TARGET_HIT','DAILY_STOP','PREMARKET','AI_MARKET_SCAN','AI_SELL_SCAN','AI_SELL_DECISION','FORCE_CLOSE_MARKET','SWING_SCAN','GLOBAL_BRIEFING','GLOBAL_ERROR','MORNING_BRIEFING','NOON_BRIEFING','AFTERNOON_BRIEFING','MIDDAY_BRIEFING','CLOSING_BRIEFING','SYSTEM'];
  const AUTO_LOG_ALL=[...AUTO_LOG_MAJOR,'SCAN_TICK','BUY','BUY_ERROR','SYSTEM','KRX_CLOSE'];
  const allAutoLog=allLog.filter(l=>AUTO_LOG_ALL.includes(l.type));
  const todayAutoLog=allAutoLog.filter(l=>(l.time||'').startsWith(today)||(l.date||'').startsWith(today));
  const showAllLog=S._logShowAll||false;
  const visibleLog=(showAllLog?allAutoLog:allAutoLog.filter(l=>AUTO_LOG_MAJOR.includes(l.type))).slice().reverse().slice(0,100);

  h+=`<div style="background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:18px 20px">
    <div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      📋 거래내역
      <span style="font-size:11px;color:var(--t3);font-weight:400">오늘 ${todayAutoLog.length}건 / 전체 ${allAutoLog.length}건</span>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button class="btn btn-gh btn-sm" style="padding:3px 8px;font-size:10px" onclick="S._logShowAll=!S._logShowAll;R()">${showAllLog?'주요만':'전체'}</button>
        <button class="btn btn-gh btn-sm" style="padding:3px 8px;font-size:10px" onclick="if(confirm('거래내역 초기화?')){api('auto/clear_log').then(()=>{S.log=[];R()}).catch(()=>{})}">🗑</button>
        <button class="btn btn-gh btn-sm" style="padding:3px 8px;font-size:10px" title="매매불가 종목 영구차단 목록 초기화" onclick="if(confirm('영구차단 목록 초기화? (매매불가로 차단된 종목들이 다시 스캔됩니다)')){api('auto/clear_perm_blocked').then(r=>{if(r.success)toast('🚫 영구차단 초기화 완료','success')}).catch(()=>{})}">🚫초기화</button>
      </div>
    </div>`;
  if(visibleLog.length){
    const tm={AI_BUY:'🤖AI매수',CHAT_BUY:'📥매수',TG_BUY:'📱텔레매수',SWING_BUY:'📥매수',MANUAL_ADD:'🤖AI매수',SELL:'🟢매도',CHAT_SELL:'📤매도',AI_SELL:'🟢매도',FORCE_CLOSE:'📤청산',FORCE_CLOSE_MARKET:'⏹장마감청산',BLOCKED:'🚫차단',CAPITAL_BLOCK:'💰차단',ERROR:'❌오류',SELL_ERROR:'❌매도오류',BUY_ERROR:'❌매수오류',AI_VERIFY_FAIL:'🚫검증차단',AI_VERIFY_PASS:'✅검증통과',AI_ERROR:'⚠️AI오류',AI_SELL_DECISION:'📊판정',AVG_DOWN:'💧물타기',TARGET_HIT:'🎯목표',DAILY_STOP:'🛑차단',PREMARKET:'📡프리',SCAN_TICK:'⏱스캔',AI_MARKET_SCAN:'🔍스캔',AI_SELL_SCAN:'📊매도스캔',SWING_SCAN:'📋스캔',GLOBAL_BRIEFING:'🌍모닝',GLOBAL_ERROR:'⚠️브리핑오류',MORNING_BRIEFING:'🌅오전',NOON_BRIEFING:'🍱점심',AFTERNOON_BRIEFING:'☀️오후',MIDDAY_BRIEFING:'📊중간',CLOSING_BRIEFING:'🌙마감',SUPPLEMENT_BRIEFING:'📡보완',BUY:'🖐️수동매수',AVG_WAITING:'⏳물타기대기',SYSTEM:'⚙️시스템'};
    const tc={AI_BUY:'var(--purple)',CHAT_BUY:'var(--cyan)',SELL:'var(--green)',CHAT_SELL:'var(--cyan)',AI_SELL:'#a78bfa',FORCE_CLOSE:'var(--cyan)',FORCE_CLOSE_MARKET:'#ff9800',BLOCKED:'var(--amber)',CAPITAL_BLOCK:'var(--amber)',ERROR:'var(--red)',SELL_ERROR:'var(--red)',BUY_ERROR:'var(--red)',AI_VERIFY_FAIL:'var(--amber)',AI_VERIFY_PASS:'var(--green)',AI_ERROR:'var(--amber)',AI_SELL_DECISION:'#a78bfa',TARGET_HIT:'#ffd700',PREMARKET:'var(--cyan)',AI_MARKET_SCAN:'var(--blue)',AI_SELL_SCAN:'#a78bfa',GLOBAL_BRIEFING:'var(--cyan)',GLOBAL_ERROR:'var(--red)',MORNING_BRIEFING:'var(--cyan)',NOON_BRIEFING:'var(--amber)',AFTERNOON_BRIEFING:'#ff9f43',MIDDAY_BRIEFING:'var(--amber)',CLOSING_BRIEFING:'var(--purple)',SUPPLEMENT_BRIEFING:'#00bcd4',BUY:'#2196f3'};
    h+=`<div id="autoLogBox" style="height:440px;overflow-y:auto;border:1px solid var(--bd);border-radius:10px">`;
    visibleLog.forEach(l=>{
      const t=(l.time||'').slice(11,16);
      const d=(l.time||l.date||'').slice(0,10);
      const isToday=d===today;
      const lb=l.type==='SELL'?'🟢매도':(l.buy_route==='telegram'?'📱텔레매수':(tm[l.type]||l.type));
      const c=l.type==='SELL'?(l.sell_mode==='ai'?'#a78bfa':'var(--green)'):(tc[l.type]||'var(--t3)');
      const isBuyFail=(l.type==='AI_BUY'&&l.success===false)||(l.type==='BUY'&&l.success===false)||(l.type==='CHAT_BUY'&&l.success===false);
      const isSuccess=(l.type==='AI_BUY'&&l.success===true)||(l.type==='BUY'&&l.success===true)||(l.type==='CHAT_BUY'&&l.success===true);
      const isSell=(l.type==='SELL'||l.type==='FORCE_CLOSE'||l.type==='CHAT_SELL'||l.type==='AI_SELL');
      const isBlock=(l.type==='BLOCKED'||l.type==='CAPITAL_BLOCK');
      const isScan=(l.type==='AI_MARKET_SCAN');

      // ── 금액 계산
      const tradeAmt=l.qty&&l.price?l.qty*l.price:0;
      const amtColor=isSuccess?'var(--green)':isSell?'var(--cyan)':'var(--t3)';

      // ── 행 배경/테두리
      const isAiSell=(l.type==='SELL'&&l.sell_mode==='ai');
      const rowBg=isBuyFail?'rgba(255,50,50,0.08)':isSuccess?'rgba(0,214,143,0.05)':isAiSell?'rgba(167,139,250,0.06)':isSell?'rgba(0,180,255,0.04)':'transparent';
      const leftBorder=isBuyFail?';border-left:3px solid var(--red)':isSuccess?';border-left:3px solid #00d68f':isAiSell?';border-left:3px solid #a78bfa':isSell?';border-left:3px solid var(--cyan)':'';

      // ── 종목명 + 코드 (매수/매도/차단 등 ticker 있는 경우)
      const hasStock=l.ticker&&l.ticker.length===6;
      const stockCell=hasStock
        ?`<div style="min-width:110px;max-width:140px">
            <div style="font-size:11px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sn(l.name,l.ticker)}${mktTag(l.ticker)}</div>
            <div class="mono" style="font-size:9px;color:var(--t3)">${l.ticker}</div>
          </div>`
        :`<div style="min-width:110px"></div>`;

      // ── 수량/단가/거래금액 셀 + 매도 손익
      const _sellPnl = isSell ? parseFloat(l.pnl||0) : 0;
      const _sellPct = isSell ? parseFloat(l.pnl_pct||0) : 0;
      const _hasPnl = isSell && (l.pnl!==undefined && l.pnl!==null && parseFloat(l.avg_price||0)>0);
      const tradeCell=(l.qty||l.price)
        ?`<div style="min-width:140px;text-align:right">
            ${l.qty?`<span class="mono" style="font-size:11px;color:var(--t2)">${fmt(l.qty)}주</span>`:''}
            ${l.price?`<span class="mono" style="font-size:11px;color:var(--t2);margin-left:4px">@₩${fmt(l.price)}</span>`:''}
            ${tradeAmt?`<div class="mono" style="font-size:10px;color:${amtColor};font-weight:600">₩${fmt(tradeAmt)}</div>`:''}
            ${_hasPnl?`<div class="mono" style="font-size:10px;font-weight:700;color:${_sellPnl>=0?'var(--green)':'var(--red)'}">${_sellPnl>=0?'+':''}₩${fmt(Math.round(_sellPnl))} (${_sellPct>=0?'+':''}${_sellPct.toFixed(1)}%)</div>${l.trade_cost?`<div style="font-size:8px;color:var(--t3)">비용 -₩${fmt(l.trade_cost)}</div>`:''}`:''}
          </div>`
        :`<div style="min-width:140px"></div>`;

      // ── 메시지 (스캔은 짧게, 나머지는 그대로)
      const msgText=l.message||l.reason||'';
      // ★ v5.0: 매수 시 sell_plan 표시
      const _sp=l.sell_plan||{};
      const _spSl=(_sp.sl||'설정sl')+'%';
      const _spTag=(isSuccess&&_sp.tp1)?` <span style="font-size:8px;padding:1px 4px;border-radius:3px;background:#a78bfa18;color:#a78bfa;border:1px solid #a78bfa33">🧠 tp${_sp.tp1}% sl${_spSl} ${_sp.time_limit||''}분 [${_sp.style||''}]</span>`:'';
      // ★ v6.0: 매수 AI 모델 표시
      const _aiMdl=l.ai_model||'';
      const _mdlTag=(isSuccess&&_aiMdl)?` <span style="font-size:8px;padding:1px 4px;border-radius:3px;background:${_aiMdl.includes('mini')?'#00d68f18':'#ff980018'};color:${_aiMdl.includes('mini')?'#00d68f':'#ff9800'};border:1px solid ${_aiMdl.includes('mini')?'#00d68f33':'#ff980033'}">${_aiMdl.includes('mini')?'⚡mini':'🧠4o'}</span>`:'';
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);background:${rowBg}${leftBorder};cursor:default" title="${msgText.replace(/"/g,"'")}">
        <span class="mono" style="font-size:9px;color:var(--t3);min-width:${isToday?'38px':'72px'};flex-shrink:0">${isToday?t:d.slice(5)+' '+t}</span>
        <span style="min-width:72px;flex-shrink:0;font-weight:700;font-size:10px;color:${isBuyFail?'var(--red)':c}">${isBuyFail?'❌주문실패':lb}</span>
        ${stockCell}
        ${tradeCell}
        <span style="flex:1;color:${isBuyFail?'var(--red)':isBlock?'var(--amber)':'var(--t2)'};font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${msgText}${_spTag}${_mdlTag}</span>
      </div>`;
    });
    h+=`</div>`;
    setTimeout(()=>{const b=document.getElementById('autoLogBox');if(b&&window._atLogScroll!=null)b.scrollTop=window._atLogScroll;if(b)b.onscroll=()=>{window._atLogScroll=b.scrollTop};},50);
  } else {
    h+=`<div style="text-align:center;padding:30px;color:var(--t3);font-size:12px;border:1px solid var(--bd);border-radius:10px">
      <div style="font-size:20px;margin-bottom:6px">📋</div>
      ${(S.log||[]).length>0
        ?`S.log ${(S.log||[]).length}건 있으나 필터 후 0건 (allAutoLog=${allAutoLog.length}건)`
        :'자동매매를 시작하면 실시간 거래내역이 여기에 표시됩니다.'}
    </div>`;
  }
  h+=`</div>`;
  return h;
  }catch(e){
    console.error('[rAuto ERROR]',e);
    return `<div style="padding:20px;color:var(--red);font-size:13px;background:#ff000010;border:2px solid var(--red);border-radius:10px;margin:20px">
      <b>rAuto 렌더링 오류</b><br>
      ${e.message}<br>
      <pre style="font-size:10px;margin-top:8px;color:var(--t2);overflow:auto;max-height:200px">${e.stack||''}</pre>
      <div style="margin-top:8px;font-size:11px;color:var(--t3)">S.log: ${(S.log||[]).length}건 | S.pos: ${(S.pos||[]).length}건 | S.autoTickers: ${(S.autoTickers||[]).length}건</div>
    </div>`;
  }
}

function fmtAI(raw){
  if(!raw)return'';
  let s=escHtml(raw);
  s=s.replace(/^#{3,}\s*(.+)$/gm,'<div style="font-size:12px;font-weight:700;color:var(--cyan);margin:10px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--bd)">$1</div>');
  s=s.replace(/^##\s*(.+)$/gm,'<div style="font-size:13px;font-weight:800;color:var(--blue);margin:14px 0 8px;padding:6px 0;border-bottom:2px solid var(--blue)33">$1</div>');
  s=s.replace(/^#\s*(.+)$/gm,'<div style="font-size:15px;font-weight:800;color:var(--t1);margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--blue)">$1</div>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b style="color:var(--t1)">$1</b>');
  s=s.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em style="color:var(--t2)">$1</em>');
  s=s.replace(/^[\-•]\s+(.+)$/gm,'<div style="padding:2px 0 2px 14px;position:relative;font-size:12px"><span style="position:absolute;left:0;color:var(--blue)">•</span>$1</div>');
  s=s.replace(/^(\d+)\.\s+(.+)$/gm,'<div style="padding:3px 0 3px 20px;position:relative;font-size:12px"><span style="position:absolute;left:0;color:var(--blue);font-weight:700;font-size:11px">$1.</span>$2</div>');
  s=s.replace(/(상승|강세|매수|긍정|호재|개선|증가)/g,'<span style="color:var(--green);font-weight:600">$1</span>');
  s=s.replace(/(하락|약세|매도|부정|악재|감소|위험)/g,'<span style="color:var(--red);font-weight:600">$1</span>');
  s=s.replace(/([+\-]?\d+[\.,]?\d*%)/g,'<span class="mono" style="font-weight:600">$1</span>');
  s=s.replace(/(₩[\d,]+)/g,'<span class="mono" style="font-weight:600">$1</span>');
  s=s.replace(/\[\[ACTION:(BUY|SELL):([^:\]]{6}):([^:\]]+):([^:\]]+):([^:\]]+)\]\]/g,function(m,type,tk,nm,qtyRaw,prRaw){
    const isBuy=type==='BUY';
    const qty=parseInt(String(qtyRaw).replace(/[^\d]/g,''))||0;
    const pr=parseInt(String(prRaw).replace(/[^\d]/g,''))||0;
    if(!qty)return'<div style="margin:8px 0;padding:8px 14px;background:#ff980012;border:1px solid #ff980044;border-radius:8px;font-size:11px;color:#ff9800">⚠️ 수량을 지정해주세요. 예: "삼성전자 2주 매수해줘"</div>';
    return '<div style="margin:8px 0;padding:10px 14px;background:'+(isBuy?'#ff475712':'#00d68f12')+';border:1px solid '+(isBuy?'#ff475744':'#00d68f44')+';border-radius:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +'<span style="font-size:14px">'+(isBuy?'🔴':'🟢')+'</span>'
      +'<span style="font-size:12px;font-weight:700;color:'+(isBuy?'var(--red)':'var(--green)')+'">'+(isBuy?'매수':'매도')+'</span>'
      +'<span style="font-size:12px;font-weight:600">'+nm+'</span>'
      +'<span class="mono" style="font-size:10px;color:var(--t3)">'+tk+'</span>'
      +'<span class="mono" style="font-size:12px">'+qty+'주</span>'
      +'<span class="mono" style="font-size:11px;color:var(--t3)">'+(pr?'₩'+pr.toLocaleString():'시장가')+'</span>'
      +'<span style="margin-left:auto;font-size:10px;color:var(--t3)"></span>'
      +'</div>';
  });
  // ★ RATING 태그 → 점수+등급+근거 카드
  s=s.replace(/\[\[RATING:(\d+):([^:\]]+):([^\]]+)\]\]/g,function(m,score,grade,reasons){
    const sc=parseInt(score);
    const rs=reasons.split(',').map(r=>r.trim()).filter(r=>r);

    const g=grades[grade]||grades['보통'];
    const scClr=sc>=80?'#ff6b00':sc>=65?'#00d68f':sc>=45?'#ff9800':'#ff4757';
    const allGrades=['강력추천','추천','보통','보류','매도'];
    const gradeList=allGrades.map(gn=>{const isA=gn===grade;const gi=grades[gn];return'<span style="display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:'+(isA?'700':'400')+';background:'+(isA?gi.bg:'transparent')+';border:1px solid '+(isA?gi.bd:'var(--bd)')+';color:'+(isA?gi.clr:'var(--t3)')+'">'+(isA?gi.icon+' ':'')+gn+'</span>'}).join('');
    const negKw=['부담','부족','매도','부진','하락','약세','리스크','과열','급등','차단','우려','감소','적자','마이너스','손실'];
    const reasonTags=rs.map(r=>{const isN=negKw.some(k=>r.includes(k));return'<span style="font-size:10px;padding:3px 8px;border-radius:6px;background:'+(isN?'#ff475710':'#00d68f10')+';border:1px solid '+(isN?'#ff475730':'#00d68f30')+';color:'+(isN?'#ff4757':'#00d68f')+'">'+(isN?'▼ ':'▲ ')+r+'</span>'}).join('');
    return'<div style="margin:12px 0;padding:14px;background:var(--bg1);border:1px solid var(--bd);border-radius:12px">'
    +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">'
    +'<div style="position:relative;width:56px;height:56px;flex-shrink:0">'
    +'<svg viewBox="0 0 56 56" style="transform:rotate(-90deg)">'
    +'<circle cx="28" cy="28" r="24" fill="none" stroke="var(--bg3)" stroke-width="4"/>'
    +'<circle cx="28" cy="28" r="24" fill="none" stroke="'+scClr+'" stroke-width="4" stroke-dasharray="'+Math.round(sc*1.508)+' 151" stroke-linecap="round"/>'
    +'</svg>'
    +'<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'
    +'<span style="font-size:18px;font-weight:800;color:'+scClr+';line-height:1;font-family:var(--mono)">'+sc+'</span>'
    +'<span style="font-size:7px;color:var(--t3)">/ 100</span>'
    +'</div></div>'
    +'<div style="flex:1">'
    +'<div style="font-size:11px;font-weight:700;color:var(--t2);margin-bottom:6px">📊 매수 의견</div>'

    +reasonTags+'</div></div>';
  });
  s=s.replace(/\n\n/g,'<div style="margin:8px 0"></div>');
  s=s.replace(/\n/g,'<br>');
  return s;
}

        dates.forEach(d=>{
          const v=byDate[d];const dp=v.pnl;const dpc=dp>0?'var(--green)':dp<0?'var(--red)':'var(--t3)';
          const wr=v.wins+v.losses>0?Math.round(v.wins/(v.wins+v.losses)*100)+'%':'-';

    }

    // 매도 내역 (접이식, 스크롤)

    h+=`<div style="padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;cursor:pointer" onclick="S._sec_resSell=S._sec_resSell===false?true:!S._sec_resSell;R()">`;

    h+=`<button class="btn btn-gh btn-sm" style="font-size:9px;padding:2px 8px" onclick="event.stopPropagation();printTradeReport()">🖨️ 인쇄</button>`;

    if(S._sec_resSell!==false&&sellCount){
      const ss=sells.slice().sort((a,b)=>(b.time||'').localeCompare(a.time||''));
      h+=`<div style="max-height:280px;overflow-y:auto"><table class="tbl"><thead style="position:sticky;top:0;background:var(--bg2);z-index:1"><tr><th>시간</th><th>종목</th><th class="r">수량</th><th class="r">매도가</th><th class="r">순손익</th><th class="r">수익률<span style="font-size:8px;color:var(--t3)">(비용포함)</span></th><th>사유</th></tr></thead><tbody>`;
      ss.forEach(s=>{
        const t=s.time?new Date(s.time).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';
        const pnl=s.pnl!=null?parseFloat(s.pnl):null;
        const pc=pnl==null?'var(--t3)':pnl>0?'var(--green)':'var(--red)';
        const cost=s.trade_cost?`<span style="font-size:8px;color:var(--t3)"> -₩${fmt(s.trade_cost)}</span>`:'';
        const sd=s.stock_data||{};
        const hasSD=sd.open||sd.high||sd.low;
        const sdRow=hasSD?`<tr style="background:rgba(100,100,255,0.03)"><td colspan="7" style="padding:3px 8px 6px;border-top:none">
          <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:9px;color:var(--t3)">
            <span>전일 ₩${fmt(sd.prev_close||0)}</span>
            <span>시가 ₩${fmt(sd.open||0)}</span>
            <span style="color:var(--green)">고가 ₩${fmt(sd.high||0)}</span>
            <span style="color:var(--red)">저가 ₩${fmt(sd.low||0)}</span>
            <span>등락 ${sd.day_chg>=0?'+':''}${(sd.day_chg||0).toFixed(1)}%</span>
            ${sd.hold_minutes?`<span>보유 ${sd.hold_minutes>=60?Math.floor(sd.hold_minutes/60)+'시간'+sd.hold_minutes%60+'분':sd.hold_minutes+'분'}</span>`:''}
            ${sd.peak_price?`<span>고점₩${fmt(sd.peak_price)} (${sd.from_peak_pct>=0?'+':''}${(sd.from_peak_pct||0).toFixed(1)}%)</span>`:''}
            ${sd.from_open_pct!=null?`<span>시가대비 ${sd.from_open_pct>=0?'+':''}${(sd.from_open_pct||0).toFixed(1)}%</span>`:''}
            ${sd.volume?`<span>거래량 ${(sd.volume/10000).toFixed(0)}만</span>`:''}
            ${sd.strength?`<span>체결강도 ${sd.strength}%</span>`:''}
          </div></td></tr>`:''
        h+=`<tr style="cursor:pointer" title="클릭하면 상세 데이터"><td class="mono" style="font-size:10px;color:var(--t3)">${t}</td><td style="font-weight:600">${sn(s.name,s.ticker)}<span style="font-size:9px;color:var(--t3);margin-left:4px">${s.ticker||''}</span></td><td class="r mono">${s.qty||'-'}</td><td class="r mono">₩${fmt(s.price||0)}</td><td class="r mono" style="color:${pc};font-weight:700">${pnl!=null?(pnl>=0?'+':'')+fW(pnl):'-'}${cost}</td><td class="r mono" style="color:${pc}">${s.pnl_pct?(s.pnl_pct>=0?'+':'')+s.pnl_pct.toFixed(1)+'%':'-'}</td><td style="font-size:10px;color:var(--t3)">${s.reason||''}</td></tr>${sdRow}`;
      });
      h+=`</tbody></table></div>`;
    }else if(S._sec_resSell!==false){h+=`<div style="text-align:center;padding:30px;color:var(--t3);font-size:12px">매도 내역 없음</div>`}
    h+=`</div>`;

    // 매수 내역 (접이식)
    const buyOpen=S._sec_resBuy===true;
    h+=`<div style="background:var(--bg2);border:1px solid var(--bd);border-radius:14px;overflow:hidden">`;
    h+=`<div style="padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:8px" onclick="S._sec_resBuy=!S._sec_resBuy;R()">`;
    h+=`<span style="font-size:12px;font-weight:700;color:var(--red)">🔴 매수 내역 ${buyCount}건</span>`;
    h+=`<span style="font-size:12px;color:var(--t3);margin-left:auto;transform:rotate(${buyOpen?180:0}deg)">▼</span></div>`;
    if(buyOpen&&buyCount){
      const bs=buys.slice().sort((a,b)=>(b.time||'').localeCompare(a.time||''));
      h+=`<div style="border-top:1px solid var(--bd);max-height:280px;overflow-y:auto"><table class="tbl"><thead style="position:sticky;top:0;background:var(--bg2);z-index:1"><tr><th>시간</th><th>종목</th><th>경로</th><th class="r">수량</th><th class="r">매수가</th><th>메모</th></tr></thead><tbody>`;
      bs.forEach(b=>{
        const t=b.time?new Date(b.time).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';
        h+=`<tr><td class="mono" style="font-size:10px;color:var(--t3)">${t}</td><td style="font-weight:600">${sn(b.name,b.ticker)}</td><td style="font-size:10px;color:var(--purple)">${b.type==='CHAT_BUY'?'💬챗':'🤖AI'}</td><td class="r mono">${b.qty||'-'}</td><td class="r mono">₩${fmt(b.price||0)}</td><td style="font-size:10px;color:var(--t3)">${b.reason||''}</td></tr>`;
      });
      h+=`</tbody></table></div>`;
    }
    h+=`</div>`;
  }

  // ═══════════════════════════════════════════
  // SUB-TAB: 수익 차트
  // ═══════════════════════════════════════════
  else if(S._resSub==='chart'){
    // 일별 손익 데이터 생성
    const byDate={};
    allLog.forEach(l=>{
      const d=(l.date||l.time||'').slice(0,10);if(!d)return;
      if(!byDate[d])byDate[d]={pnl:0,buys:0,sells:0};
      if(['SELL','FORCE_CLOSE'].includes(l.type)&&(l.success===true||l.success===1)&&l.pnl)byDate[d].pnl+=parseFloat(l.pnl);
      if(['AI_BUY','BUY'].includes(l.type)&&l.success!==false)byDate[d].buys++;
      if(['SELL','FORCE_CLOSE'].includes(l.type)&&l.success!==false)byDate[d].sells++;
    });
    let chartDates=Object.keys(byDate).sort();
    if(S._resMode==='range')chartDates=chartDates.filter(d=>d>=S._resFrom&&d<=S._resTo);
    else chartDates=chartDates.slice(-30); // 최근 30일

    if(chartDates.length>0){
      // SVG 바 차트
      const W=Math.max(chartDates.length*40,600),H=220,pad=40;
      const vals=chartDates.map(d=>byDate[d].pnl);
      const maxV=Math.max(...vals.map(Math.abs),1);
      const barW=Math.min(24,Math.floor((W-pad*2)/chartDates.length*0.7));
      const mid=pad+((H-pad*2)/2);
      let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;background:var(--bg1);border-radius:10px">`;
      // 0선
      svg+=`<line x1="${pad}" y1="${mid}" x2="${W-pad}" y2="${mid}" stroke="var(--t3)" stroke-width="0.5" stroke-dasharray="4"/>`;
      svg+=`<text x="${pad-4}" y="${mid+3}" font-size="9" fill="var(--t3)" text-anchor="end">0</text>`;
      // 누적 손익 라인
      let cumPnl=0;const cumPoints=[];
      chartDates.forEach((d,i)=>{
        const v=byDate[d].pnl;
        cumPnl+=v;
        const x=pad+i*((W-pad*2)/chartDates.length)+barW/2;
        // 바
        const bH=Math.abs(v)/maxV*((H-pad*2)/2);
        const by=v>=0?mid-bH:mid;
        const clr=v>=0?'#00d68f':'#ff4757';
        svg+=`<rect x="${x-barW/2}" y="${by}" width="${barW}" height="${Math.max(bH,1)}" fill="${clr}" opacity="0.7" rx="2"/>`;
        // 날짜 라벨 (7일 간격)
        if(i%Math.max(1,Math.floor(chartDates.length/10))===0||i===chartDates.length-1){
          svg+=`<text x="${x}" y="${H-5}" font-size="8" fill="var(--t3)" text-anchor="middle">${d.slice(5)}</text>`;
        }
        // 누적 포인트
        const cumH=cumPnl===0?0:(cumPnl/Math.max(Math.abs(cumPnl),maxV)*((H-pad*2)/2));
        cumPoints.push(`${x},${mid-cumH}`);
      });
      // 누적 라인
      if(cumPoints.length>1){
        svg+=`<polyline points="${cumPoints.join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2" opacity="0.8"/>`;
        // 마지막 점
        const lastPt=cumPoints[cumPoints.length-1].split(',');
        svg+=`<circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="4" fill="var(--blue)"/>`;
        svg+=`<text x="${parseFloat(lastPt[0])+8}" y="${parseFloat(lastPt[1])+3}" font-size="10" fill="var(--blue)" font-weight="700">${cumPnl>=0?'+':''}₩${fW(Math.abs(cumPnl))}</text>`;
      }
      svg+=`</svg>`;

      h+=`<div style="background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <span style="font-size:13px;font-weight:700;color:var(--t1)">📊 일별 손익 추이</span>
          <span style="font-size:10px;color:var(--t3)">${chartDates.length}일간</span>
          <div style="margin-left:auto;display:flex;gap:10px;font-size:9px">
            <span><span style="display:inline-block;width:10px;height:10px;background:#00d68f;border-radius:2px;vertical-align:middle"></span> 이익</span>
            <span><span style="display:inline-block;width:10px;height:10px;background:#ff4757;border-radius:2px;vertical-align:middle"></span> 손실</span>
            <span><span style="display:inline-block;width:10px;height:3px;background:var(--blue);vertical-align:middle"></span> 누적</span>
          </div>
        </div>
        <div style="overflow-x:auto">${svg}</div>
      </div>`;

      // 누적 통계
      const totWin=vals.filter(v=>v>0).reduce((a,b)=>a+b,0);
      const totLoss=vals.filter(v=>v<0).reduce((a,b)=>a+b,0);
      const winDays=vals.filter(v=>v>0).length;
      const lossDays=vals.filter(v=>v<0).length;
      const avgWin=winDays>0?totWin/winDays:0;
      const avgLoss=lossDays>0?totLoss/lossDays:0;
      h+=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">
        <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:9px;color:var(--t3)">누적 손익</div>
          <div style="font-size:16px;font-weight:700;color:${cumPnl>=0?'var(--green)':'var(--red)'}">${cumPnl>=0?'+':''}₩${fW(Math.abs(cumPnl))}</div>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:9px;color:var(--t3)">승/패일</div>
          <div style="font-size:16px;font-weight:700;color:var(--t1)">${winDays}일 / ${lossDays}일</div>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:9px;color:var(--t3)">평균 이익일</div>
          <div style="font-size:16px;font-weight:700;color:var(--green)">+₩${fW(Math.abs(avgWin))}</div>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:9px;color:var(--t3)">평균 손실일</div>
          <div style="font-size:16px;font-weight:700;color:var(--red)">-₩${fW(Math.abs(avgLoss))}</div>
        </div>
      </div>`;
    }else{
      h+=`<div style="background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:40px;text-align:center;color:var(--t3)">매매 데이터가 없습니다. 자동매매 시작 후 차트가 생성됩니다.</div>`;
    }
  }

  // ═══════════════════════════════════════════
  // SUB-TAB: 성과분석 (TIER 2)
  // ═══════════════════════════════════════════
  else if(S._resSub==='perf'){
    if(!S._anaData){loadAnalytics();h+=`<div style="background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:40px;text-align:center;color:var(--t3)">성과 데이터 로딩 중...</div>`;}
    else{
    const a = S._anaData.summary || {};
    const pc = a.total_pnl >= 0 ? 'var(--green)' : 'var(--red)';
    h+=`<div style="background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <span style="font-size:15px;font-weight:700;color:var(--t1)">🏆 매매 성과 분석</span>
        <button class="btn btn-gh btn-sm" style="margin-left:auto;font-size:10px" onclick="S._anaData=null;loadAnalytics();R()">↻ 갱신</button>
      </div>
      <div class="g4" style="margin-bottom:14px">
        <div class="stat"><div class="stat-v" style="color:${pc}">${a.total_pnl>=0?'+':''}${(a.total_pnl||0).toLocaleString()}</div><div class="stat-l">총 실현손익</div></div>
        <div class="stat"><div class="stat-v" style="color:${a.win_rate>=50?'var(--green)':'var(--red)'}">${a.win_rate||0}%</div><div class="stat-l">승률 (${a.wins||0}승${a.losses||0}패)</div></div>
        <div class="stat"><div class="stat-v mono">${(a.profit_factor||0).toFixed(1)}</div><div class="stat-l">Profit Factor</div></div>
        <div class="stat"><div class="stat-v" style="color:var(--red)">-${(a.max_drawdown||0).toLocaleString()}</div><div class="stat-l">최대 낙폭(MDD)</div></div>
      </div>
      <div class="g4" style="margin-bottom:14px">
        <div class="stat"><div class="stat-v" style="color:var(--green)">+${(a.avg_win||0).toLocaleString()}</div><div class="stat-l">평균 수익</div></div>
        <div class="stat"><div class="stat-v" style="color:var(--red)">-${(a.avg_loss||0).toLocaleString()}</div><div class="stat-l">평균 손실</div></div>
        <div class="stat"><div class="stat-v mono">${a.active_days||0}일</div><div class="stat-l">활성 거래일</div></div>
        <div class="stat"><div class="stat-v mono">${a.avg_trades_per_day||0}</div><div class="stat-l">일평균 거래</div></div>
      </div>`;
    // ★ 매도 성과 분석
    const _allSellLogs=(S._anaData.all_sells||S.log||[]).filter(l=>l.type==='SELL'&&(l.success===true||l.success===1));
    const _aiS=_allSellLogs.filter(l=>l.sell_mode==='ai');
    const _manS=_allSellLogs.filter(l=>l.sell_mode!=='ai');
    if(_aiS.length>0||_manS.length>0){
      const _calc=arr=>{
        const pnl=arr.reduce((s,l)=>s+(parseFloat(l.pnl)||0),0);
        const w=arr.filter(l=>parseFloat(l.pnl||0)>0).length;
        const lo=arr.filter(l=>parseFloat(l.pnl||0)<0).length;
        const wr=w+lo>0?Math.round(w/(w+lo)*100):0;
        const avgW=w>0?arr.filter(l=>parseFloat(l.pnl||0)>0).reduce((s,l)=>s+(parseFloat(l.pnl)||0),0)/w:0;
        const avgL=lo>0?Math.abs(arr.filter(l=>parseFloat(l.pnl||0)<0).reduce((s,l)=>s+(parseFloat(l.pnl)||0),0)/lo):0;
        const pf=avgL>0?(avgW*w)/(avgL*lo):w>0?99:0;
        return {cnt:arr.length,pnl,w,lo,wr,avgW:Math.round(avgW),avgL:Math.round(avgL),pf:pf.toFixed(1)};
      };
      const ai=_calc(_aiS),man=_calc(_manS);
      const _better=ai.pnl>man.pnl?'ai':'manual';
      h+=`<div style="background:var(--bg1);border:1px solid #a78bfa33;border-radius:12px;padding:14px;margin:14px 0">
        <div style="font-size:13px;font-weight:700;color:#a78bfa;margin-bottom:10px">📊 매도 성과 분석</div>
        <div style="display:grid;grid-template-columns:1fr 80px 1fr;gap:0;font-size:11px">
          <div style="text-align:center;padding:8px;background:${_better==='ai'?'rgba(167,139,250,0.08)':'transparent'};border-radius:8px">
            <div style="font-weight:700;color:#a78bfa;margin-bottom:6px">🤖 자동매도</div>
            <div class="mono" style="font-size:16px;font-weight:800;color:${ai.pnl>=0?'var(--green)':'var(--red)'}">${ai.pnl>=0?'+':''}₩${Math.round(ai.pnl).toLocaleString()}</div>
            <div style="color:var(--t3);margin-top:4px">${ai.cnt}건 · 승률 ${ai.wr}% · ${ai.w}W/${ai.lo}L</div>
            <div style="color:var(--t3)">평균수익 +₩${ai.avgW.toLocaleString()} · 평균손실 -₩${ai.avgL.toLocaleString()}</div>
            <div style="color:var(--t3)">PF ${ai.pf}</div>
          </div>
          <div style="display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--t3)">vs</div>
          <div style="text-align:center;padding:8px;background:${_better==='manual'?'rgba(0,214,143,0.08)':'transparent'};border-radius:8px">
            <div style="font-weight:700;color:var(--green);margin-bottom:6px">⚙️ 수동매도</div>
            <div class="mono" style="font-size:16px;font-weight:800;color:${man.pnl>=0?'var(--green)':'var(--red)'}">${man.pnl>=0?'+':''}₩${Math.round(man.pnl).toLocaleString()}</div>
            <div style="color:var(--t3);margin-top:4px">${man.cnt}건 · 승률 ${man.wr}% · ${man.w}W/${man.lo}L</div>
            <div style="color:var(--t3)">평균수익 +₩${man.avgW.toLocaleString()} · 평균손실 -₩${man.avgL.toLocaleString()}</div>
            <div style="color:var(--t3)">PF ${man.pf}</div>
          </div>
        </div>
      </div>`;
    }
    const best = S._anaData.best_stocks || [];
    const worst = S._anaData.worst_stocks || [];
    if(best.length || worst.length) {
      h += `<div class="g2">`;
      if(best.length) {
        h += `<div style="background:var(--bg1);border-radius:10px;padding:12px"><div style="font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px">🏆 수익 TOP 종목</div>`;
