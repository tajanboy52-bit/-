// ★★★ v3.0: WebSocket 실시간 연결 ★★★
let _ws = null;
function shiftDate(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10)}

let _wsRetry = 0;
let _wsConnected = false;
let _wsFallbackTimer = null;

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${proto}//${location.host}/ws`;
  try {
    _ws = new WebSocket(wsUrl);
  } catch(e) { console.warn('[WS] 생성 실패:', e); startFallbackPolling(); return; }

  _ws.onopen = () => {
    _wsConnected = true;
    _wsRetry = 0;
    console.log('[WS] ✅ 연결 성공');
    document.getElementById('sDot').className='dot on';
    document.getElementById('sLbl').textContent='WS연결';
    document.getElementById('sLbl').style.color='var(--green)';
    // fallback 폴링 중지
    if (_wsFallbackTimer) { clearInterval(_wsFallbackTimer); _wsFallbackTimer = null; }
  };

  _ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleWSEvent(msg.event, msg.data || {});
    } catch(err) { console.warn('[WS] 파싱 오류:', err); }
  };

  _ws.onclose = () => {
    _wsConnected = false;
    console.log('[WS] 🔌 연결 해제');
    document.getElementById('sLbl').textContent='재연결중';
    document.getElementById('sLbl').style.color='var(--amber)';
    // 지수 백오프 재연결 (최대 30초)
    const delay = Math.min(1000 * Math.pow(2, _wsRetry), 30000);
    _wsRetry++;
    setTimeout(connectWS, delay);
    // fallback 폴링 시작
    startFallbackPolling();
  };

  _ws.onerror = () => { _ws.close(); };
}

function handleWSEvent(event, data) {
  switch(event) {
    case 'connected':
      S.autoRunning = data.running;
      if(data.auto_tickers) S.autoTickers = data.auto_tickers;
      if(data.phase) S.phase = data.phase;
      R();
      break;

    case 'buy':
      toast(`🟢 매수: ${data.name} ${data.qty}주 ₩${(data.price||0).toLocaleString()}`, 'success');
      S.log.push({time:new Date().toISOString(), type:'AI_BUY', ticker:data.ticker, name:data.name,
        qty:data.qty, price:data.price, reason:data.reason, success:true,
        date:new Date().toISOString().slice(0,10)});
      if(data.ticker && !S.autoTickers.includes(data.ticker)) S.autoTickers.push(data.ticker);
      // ★★★ v8.0: 즉시 S.pos에 추가 (kisRefresh 대기 안 함) ★★★
      if(data.ticker && !S.pos.some(p=>p.pdno===data.ticker)) {
        S.pos.push({pdno:data.ticker, prdt_name:data.name, hldg_qty:String(data.qty),
          prpr:String(data.price||0), pchs_avg_pric:String(data.price||0),
          evlu_amt:String((data.price||0)*(data.qty||0)),
          evlu_pfls_amt:'0', evlu_pfls_rt:'0.00'});
      }
      R();
      setTimeout(()=>kisRefresh(),2000);
      break;

    case 'sell':
      const pnlEmoji = (data.pnl_pct||0) >= 0 ? '🟢' : '🔴';
      const pnlSign = (data.pnl_pct||0) >= 0 ? '+' : '';
      toast(`${pnlEmoji} 매도: ${data.name} ${pnlSign}${(data.pnl_pct||0).toFixed(1)}% (₩${(data.pnl||0).toLocaleString()})`, 'info');
      S.log.push({time:new Date().toISOString(), type:'SELL', ticker:data.ticker, name:data.name,
        qty:data.qty, price:data.price, pnl:data.pnl, pnl_pct:data.pnl_pct,
        reason:data.reason, success:true, date:new Date().toISOString().slice(0,10)});
      // ★★★ v8.0: 즉시 S.pos에서 제거 (kisRefresh 대기 안 함) ★★★
      const _soldTk = data.ticker;
      const _soldQty = parseInt(data.qty||0);
      S.pos = S.pos.map(p => {
        if(p.pdno === _soldTk) {
          const _remain = parseInt(p.hldg_qty||0) - _soldQty;
          if(_remain <= 0) return null;  // 전량매도 → 제거
          return {...p, hldg_qty: String(_remain)};  // 분할매도 → 수량 감소
        }
        return p;
      }).filter(Boolean);
      S.autoTickers = S.autoTickers.filter(t => t !== _soldTk || S.pos.some(p=>p.pdno===_soldTk));
      R();
      // 2초 후 잔고 갱신 (체결가 반영)
      setTimeout(()=>kisRefresh(),2000);
      break;

    case 'balance':
      // 잔고 변동 → 대시보드 갱신 트리거
      if(S.tab === 'dash') R();
      break;

    case 'positions':
      // ★★★ v8.0: WS 실시간 가격을 S.pos에 즉시 반영 (10초 지연 → 2초) ★★★
      S._livePositions = data.positions || [];
      S._liveTotalEval = data.total_eval || 0;
      S._liveCash = data.cash || 0;
      S._liveTotalPnl = data.total_pnl || 0;
      S._livePosTime = data.time || '';
      
      // ★ 핵심: S.pos 가격을 WS 실시간 가격으로 오버라이드
      if(S.pos && S._livePositions.length > 0) {
        const _priceMap = {};
        S._livePositions.forEach(lp => { if(lp.ticker && lp.cur_price) _priceMap[lp.ticker] = lp.cur_price; });
        let _posChanged = false;
        S.pos.forEach(p => {
          const _newP = _priceMap[p.pdno];
          if(_newP && _newP > 0 && String(_newP) !== p.prpr) {
            p.prpr = String(_newP);
            // 평가금/손익도 재계산
            const _q = parseInt(p.hldg_qty || 0);
            const _a = parseFloat(p.pchs_avg_pric || 0);
            if(_q > 0 && _a > 0) {
              p.evlu_amt = String(Math.round(_newP * _q));
              p.evlu_pfls_amt = String(Math.round((_newP - _a) * _q));
              p.evlu_pfls_rt = String(((_newP - _a) / _a * 100).toFixed(2));
            }
            _posChanged = true;
          }
        });
        if(_posChanged) {
          // ★★★ v8.0 성능: 가격 push R() 2초 스로틀 ★★★
          if(!S._lastPosRenderTs || (Date.now() - S._lastPosRenderTs) > 2000) {
            S._lastPosRenderTs = Date.now();
            R();
          }
        }
      }
      // ★ v3.0: 증시 데이터 저장
      if(data.market){
        const _wasEmpty = !S._mktKospi;
        S._mktKospi = data.market.kospi || S._mktKospi || '';
        S._mktKospiChg = data.market.kospi_chg || S._mktKospiChg || '';
        S._mktKosdaq = data.market.kosdaq || S._mktKosdaq || '';
        S._mktKosdaqChg = data.market.kosdaq_chg || S._mktKosdaqChg || '';
        if(_wasEmpty && S._mktKospi) R(); // 첫 도착 시 즉시 렌더
      }
      // ★ v3.0: 증시 히스토리 저장
      if(data.market_history && data.market_history.length) S._mktHistory = data.market_history;
      // ★ v3.0: 종목별 고저가 저장
      if(!S._priceDetail) S._priceDetail={};
      let _pdNew=false;
      (data.positions||[]).forEach(p=>{
        if(p.day_high||p.day_low){
          if(!S._priceDetail[p.ticker]) _pdNew=true;
          S._priceDetail[p.ticker]={high:p.day_high,low:p.day_low,open:p.day_open,market:p.market_name||'',sector:p.sector||''};
        }
      });
      // ★ v5.0: trade_log에서도 market/sector 캐시 (매도 후에도 태그 표시)
      (data.log||[]).forEach(l=>{
        if(l.ticker && (l.market||l.sector) && !S._priceDetail[l.ticker]){
          S._priceDetail[l.ticker]={market:l.market||'',sector:l.sector||''};
        }
      });
      if(_pdNew) R(); // 고저가 첫 도착 시 즉시 렌더
      // ★ v3.0 FIX: S.bal에 실시간 잔고 반영
      if(S.bal){
        S.bal.tot_evlu_amt = String(data.total_eval||0);
        S.bal.ord_psbl_cash = String(data.ord_psbl_cash||data.cash||0);
        S.bal.dnca_tot_amt = String(data.dnca_tot_amt||0);
        S.bal.evlu_pfls_smtl_amt = String(data.total_pnl||0);
      }
      // 실시간 포지션 카드 업데이트 (전체 R() 없이 DOM 직접 갱신 → 깜빡임 방지)
      const posBox = document.getElementById('ws-live-positions');
      if(posBox && S._livePositions.length > 0) {
        let ph = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
          +'<span style="font-size:11px;font-weight:700;color:var(--cyan)">📡 실시간 포지션</span>'
          +'<span style="font-size:10px;color:var(--t3)">'+S._livePosTime+'</span></div>';
        S._livePositions.forEach(p => {
          const c = p.pnl_pct >= 0 ? 'var(--green)' : 'var(--red)';
          const sign = p.pnl_pct >= 0 ? '+' : '';
          ph += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)">'
            +'<div><span style="font-weight:700;font-size:12px">'+p.name+'</span>'
            +'<span style="font-size:10px;color:var(--t3);margin-left:4px">'+p.qty+'주</span></div>'
            +'<div style="text-align:right">'
            +'<div style="font-size:13px;font-weight:700;color:'+c+';font-family:JetBrains Mono,monospace">'+sign+p.pnl_pct.toFixed(2)+'%</div>'
            +'<div style="font-size:10px;color:'+c+'">'+sign+(p.pnl_amt||0).toLocaleString()+'원</div>'
            +'</div></div>';
        });
        // 전체 평가 요약
        const tc = S._liveTotalPnl >= 0 ? 'var(--green)' : 'var(--red)';
        const ts = S._liveTotalPnl >= 0 ? '+' : '';
        ph += '<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:6px;border-top:1px solid var(--bd2)">'
          +'<span style="font-size:11px;color:var(--t2)">평가손익</span>'
          +'<span style="font-size:13px;font-weight:800;color:'+tc+';font-family:JetBrains Mono,monospace">'+ts+S._liveTotalPnl.toLocaleString()+'원</span></div>';
        posBox.innerHTML = ph;
        posBox.style.display = 'block';
      } else if(posBox && S._livePositions.length === 0) {
        posBox.style.display = 'none';
      }
      // ★ v3.0 FIX: 증시/고저가 데이터 변경 시 전체 렌더링 (30초마다)
      if(!S._lastFullR) S._lastFullR=0;
      const _now=Date.now();
      if(_now - S._lastFullR > 10000){  // ★ v8.0: 30초→10초 실시간 개선
        S._lastFullR=_now;
        R();
      }
      break;

    case 'briefing':
      toast(`📊 ${data.title}`, 'info');
      S.briefing = data;
      R();
      break;

    case 'status':
      S.autoRunning = data.running;
      if(data.paused !== undefined) S.paused = data.paused;
      if(data.phase) S.phase = data.phase;
      R();
      break;

    case 'rule_trigger':
      toast(`⚡ ${data.type}: ${data.ticker} ${(data.pnl_pct||0).toFixed(1)}%`, 'warning');
      break;

    case 'daily_target':
      toast(`🎯 수익목표 ${data.progress}% 달성!`, 'success');
      break;

    case 'pong':
      break; // heartbeat 응답
  }
}

// ★ Fallback 폴링 (WebSocket 실패 시에만)
function startFallbackPolling() {
  if (_wsFallbackTimer) return; // 이미 실행 중
  console.log('[WS] ⚠️ Fallback 폴링 시작 (15초)');
  _wsFallbackTimer = setInterval(async () => {
    if (_wsConnected) { clearInterval(_wsFallbackTimer); _wsFallbackTimer = null; return; }
    try {
      const d = await api('auto/status', {});
      S.autoRunning=d.running; S.log=d.log||[]; updScanHeader(); S.phase=d.market_phase||'';
      S.briefing=d.daily_briefing||null;
      S.dailyStopped=d.daily_stopped||false; S.dailyStopMsg=d.daily_stop_msg||'';
      if(d.today_pnl!==undefined) S._todayPnl=d.today_pnl;
      if(d.auto_tickers){S.autoTickers=d.auto_tickers}
      if(d.api_usage)updApiDisplay(d.api_usage);
      document.getElementById('sDot').className='dot on';
      document.getElementById('sLbl').textContent='폴링OK';
      document.getElementById('sLbl').style.color='var(--amber)';
      R();
    } catch(e) {
      document.getElementById('sDot').className='dot';
      document.getElementById('sLbl').textContent='연결끊김';
      document.getElementById('sLbl').style.color='var(--red)';
    }
  }, 15000);
}

(async()=>{
  const k=gk();
  if(!k.appKey||!k.appSecret){

      if(v.viewer&&v.running){

        S.phase=v.market_phase||'';

        if(v.balance){
          S.bal={
            tot_evlu_amt:v.balance.tot_evlu_amt||'0',

            evlu_pfls_smtl_amt:v.balance.evlu_pfls_smtl_amt||'0'
          };
          S._positions=(v.balance.output1||[]).filter(p=>parseInt(p.hldg_qty||0)>0);
        }
        // 포지션 카드 (WebSocket과 동일)
        if(v.positions)S._livePositions=v.positions;
        // 증시 데이터
        if(v.market){
          S._mktKospi=v.market.kospi||'';
          S._mktKospiChg=v.market.kospi_chg||'';
          S._mktKosdaq=v.market.kosdaq||'';
          S._mktKosdaqChg=v.market.kosdaq_chg||'';
        }
        if(v.market_history)S._mktHistory=v.market_history;
        // 설정
        if(v.config_summary){
          const c=v.config_summary;
          S.maxPos=c.max_pos;S.maxBuyAmt=c.max_buy;
          S.aiTp1=c.tp1;S.aiTp2=c.tp2;S.aiTp3=c.tp3;S.aiSl=c.sl;
          S.cashRatio=c.cash_ratio||60;
          S.forceClose=c.force_close||false;
          S.forceCloseTime=c.force_close_time||1515;
        }
        k.connected=true;
        S.tab='auto';
        startTmr();
        console.log('[VIEWER] Remote viewer mode - full sync');
        R();
        // 10초마다 전체 동기화
        setInterval(async()=>{
          try{
            const vs=await api('viewer/sync',{});
            if(vs.balance){
              S.bal={tot_evlu_amt:vs.balance.tot_evlu_amt||'0',dnca_tot_amt:vs.balance.dnca_tot_amt||'0',
                ord_psbl_cash:vs.balance.ord_psbl_cash||'0',evlu_pfls_smtl_amt:vs.balance.evlu_pfls_smtl_amt||'0'};
              S._positions=(vs.balance.output1||[]).filter(p=>parseInt(p.hldg_qty||0)>0);
            }
            if(vs.positions)S._livePositions=vs.positions;
            if(vs.market){
              S._mktKospi=vs.market.kospi||S._mktKospi;
              S._mktKospiChg=vs.market.kospi_chg||S._mktKospiChg;
              S._mktKosdaq=vs.market.kosdaq||S._mktKosdaq;
              S._mktKosdaqChg=vs.market.kosdaq_chg||S._mktKosdaqChg;
            }
            if(vs.market_history)S._mktHistory=vs.market_history;
            S.log=vs.log||S.log;
            S.autoRunning=vs.running;S.autoPaused=vs.paused;
            S.briefing=vs.daily_briefing||S.briefing;
            S.phase=vs.market_phase||S.phase;
            R();
          }catch(e){}
        },10000);
      }
    }catch(e){console.log('[VIEWER] sync failed:',e)}
  }
})();

S._tgHistory=[];

async function syncTgHistory(){
  if(!S.tgEnabled||!S.tgToken)return;
  try{
